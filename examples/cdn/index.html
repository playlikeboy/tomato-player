<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" href="data:," />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tomato Player · CDN example</title>
    <!-- One script tag. No build step. hls.js is fetched only if an .m3u8 is played. -->
    <script src="https://cdn.jsdelivr.net/npm/tomato-player@0/dist/tomato-player.global.js"></script>
    <style>
      body { margin: 0; padding: 32px; background: #0c0c0f; color: #eee; font: 15px system-ui; }
      main { max-width: 960px; margin: 0 auto; display: grid; gap: 32px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Declarative: &lt;tomato-player&gt;</h1>
      <tomato-player
        src="https://upload.wikimedia.org/wikipedia/commons/transcoded/c/c0/Big_Buck_Bunny_4K.webm/Big_Buck_Bunny_4K.webm.720p.vp9.webm"
        poster="https://upload.wikimedia.org/wikipedia/commons/thumb/7/70/Big.Buck.Bunny.-.Opening.Screen.png/1280px-Big.Buck.Bunny.-.Opening.Screen.png"
        title="Big Buck Bunny"
        skin="cinema"
        accent="#f59e0b"
        chapters="../assets/chapters.vtt"
      >
        <track kind="captions" src="../assets/captions.en.vtt" srclang="en" label="English" />
      </tomato-player>

      <h1>Imperative: TomatoPlayer.createPlayer()</h1>
      <div id="player"></div>
      <script>
        const { createPlayer, hls, tube, hotkeys } = window.TomatoPlayer;
        createPlayer('#player', {
          src: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8',
          providers: [hls({ library: 'https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js' })],
          skin: tube(),
          plugins: [hotkeys()],
          title: 'Adaptive HLS',
        });
      </script>
      <p><small>Big Buck Bunny © Blender Foundation, CC BY 3.0. HLS test stream by Mux.</small></p>
    </main>
  </body>
</html>
